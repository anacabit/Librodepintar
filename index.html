<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ficha para Colorear</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eeeeee;
    font-family: Arial, sans-serif;
}

.ficha {
    max-width: 1500px;
    margin: auto;
    background: white;
    padding: 10px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
}

.celda {
    position: relative;
    aspect-ratio: 1.25 / 1;
    border: 1px solid #aaa;
    border-radius: 14px;
    background: white;
    overflow: hidden;
}

.numero {
    position: absolute;
    top: 10px;
    left: 15px;
    font-size: 25px;
    font-weight: bold;
    z-index: 20;
}

svg {
    width: 100%;
    height: 100%;
}

.forma {
    fill: white;
    stroke: black;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.linea {
    fill: none;
    stroke: black;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
}

@media (max-width: 800px) {
    body {
        padding: 5px;
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .numero {
        font-size: 18px;
        top: 6px;
        left: 8px;
    }
}

@media print {
    body {
        background: white;
        padding: 0;
    }

    .ficha {
        padding: 5mm;
    }
}
</style>
</head>
