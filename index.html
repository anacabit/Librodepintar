<title>🎨 Mi Libro de Colorear</title>

<meta name="theme-color" content="#4CAF50">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
html,body{width:100%;min-height:100%;background:#FFF8F0}
body{font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
header{width:100%;background:linear-gradient(135deg,#FF6B9D,#FFB347);padding:9px 10px 7px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.15)}
header h1{font-size:1.3rem;color:white;text-shadow:2px 2px 4px rgba(0,0,0,.2)}
header p{color:rgba(255,255,255,.92);font-size:.76rem;margin-top:2px}
#instalar-app{display:none;margin:6px auto 0;border:0;background:white;color:#E91E63;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
#gallery{display:flex;gap:8px;padding:8px 10px 4px;overflow-x:auto;width:100%;scrollbar-width:none}
#gallery::-webkit-scrollbar{display:none}
.thumb{flex:0 0 56px;width:56px;height:56px;border-radius:11px;border:3px solid transparent;background:white;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow:hidden;padding:3px;cursor:pointer}
.thumb.active{border-color:#FF6B9D;box-shadow:0 0 0 3px #FF6B9D40}
#drawing-label{font-size:.88rem;font-weight:700;color:#666;text-align:center;padding:2px 0 4px}
#canvas-wrap{width:100%;padding:0 8px;display:flex;justify-content:center}
#paint-canvas{width:100%;max-width:560px;aspect-ratio:1/1;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.12);display:block;background:white;cursor:crosshair;touch-action:none}
#palette-wrap{width:100%;max-width:560px;padding:7px 10px 4px}
#palette-wrap h3{font-size:.66rem;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;text-align:center}
#palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cbtn{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid white;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.cbtn.sel{border-color:#333;box-shadow:0 0 0 3px #3333;transform:scale(1.08)}
#actions{display:flex;gap:7px;padding:7px 10px 13px;width:100%;max-width:560px}
.abtn{flex:1;padding:9px 3px;border:0;border-radius:13px;font-size:.72rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.abtn span{font-size:1.1rem}
#btn-borra{background:#FFE0B2;color:#E65100}
#btn-limpia{background:#FFCDD2;color:#C62828}
#btn-guarda{background:#C8E6C9;color:#2E7D32}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#333;color:white;padding:9px 20px;border-radius:18px;font-size:.85rem;transition:.3s;z-index:999;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
@media(max-height:700px){
  header{padding:6px}
  header h1{font-size:1.12rem}
  header p{font-size:.7rem}
  #gallery{padding-top:4px}
  .thumb{width:48px;height:48px;flex-basis:48px}
  #drawing-label{padding-bottom:2px}
  #palette-wrap{padding-top:4px}
  #actions{padding-bottom:7px}
}
</style>
</head>

/* ===== ESTADO ===== */
let currentColor=COLORS[0];
let isEraser=false;
let currentIdx=0;
const colors=DRAWINGS.map(d=>d.zones.map(()=>'white'));

/* ===== CANVAS ===== */
const canvas=document.getElementById('paint-canvas');
const ctx=canvas.getContext('2d');
const STROKE='#222';
const STROKE_W=2.5;
const DECO_STROKE='#555';
const DECO_W=1.5;
const LOGIC=300;

function resizeCanvas(){
  const max=560;
  const available=Math.min(window.innerWidth-16,max);
  canvas.width=available;
  canvas.height=available;
  canvas.style.width=available+'px';
  canvas.style.height=available+'px';
  redraw();
}

function scale(){return canvas.width/LOGIC;}

function applyTransform(t,sc){
  const m=t.match(/rotate\(([\d.-]+),([\d.-]+),([\d.-]+)\)/);
  if(!m)return;
  const ang=parseFloat(m[1])*Math.PI/180;
  const cx=parseFloat(m[2])*sc;
  const cy=parseFloat(m[3])*sc;
  ctx.translate(cx,cy);
  ctx.rotate(ang);
  ctx.translate(-cx,-cy);
}

function drawEl(el,fillColor,isDeco){
  const sc=scale();
  const A=el.a;
  ctx.save();
  if(A.transform) applyTransform(A.transform,sc);
  ctx.beginPath();

  if(el.t==='ellipse'){
    ctx.ellipse(A.cx*sc,A.cy*sc,A.rx*sc,A.ry*sc,0,0,Math.PI*2);
  } else if(el.t==='circle'){
    ctx.arc(A.cx*sc,A.cy*sc,A.r*sc,0,Math.PI*2);
  } else if(el.t==='rect'){
    const r=(A.rx||0)*sc;
    if(r>0) ctx.roundRect(A.x*sc,A.y*sc,A.width*sc,A.height*sc,r);
    else ctx.rect(A.x*sc,A.y*sc,A.width*sc,A.height*sc);
  } else if(el.t==='polygon'){
    const pts=A.points.split(' ').map(p=>p.split(',').map(Number));
    ctx.moveTo(pts[0][0]*sc,pts[0][1]*sc);
    pts.slice(1).forEach(p=>ctx.lineTo(p[0]*sc,p[1]*sc));
    ctx.closePath();
  } else if(el.t==='path'){
    try{
      const path=new Path2D(A.d);
      ctx.save();
      ctx.scale(sc,sc);
      if(isDeco){
        ctx.strokeStyle=DECO_STROKE;ctx.lineWidth=DECO_W;
        ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(path);
      } else {
        ctx.fillStyle=fillColor;ctx.fill(path);
        ctx.strokeStyle=STROKE;ctx.lineWidth=STROKE_W;
        ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(path);
      }
      ctx.restore();
    }catch(e){console.warn('Path error:',A.d);}
    ctx.restore();return;
  } else if(el.t==='line'){
    ctx.moveTo(A.x1*sc,A.y1*sc);
    ctx.lineTo(A.x2*sc,A.y2*sc);
  }

  if(isDeco){
    ctx.strokeStyle=DECO_STROKE;ctx.lineWidth=DECO_W*sc;
    ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  } else {
    ctx.fillStyle=fillColor;ctx.fill();
    ctx.strokeStyle=STROKE;ctx.lineWidth=STROKE_W*sc;
    ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  }
  ctx.restore();
}

function redraw(){
  const d=DRAWINGS[currentIdx];
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='white';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  d.zones.forEach((el,i)=>drawEl(el,colors[currentIdx][i],false));
  (d.decos||[]).forEach(el=>drawEl(el,'none',true));
}

/* ===== HIT DETECTION CORREGIDO ===== */
function inverseTransformPoint(A,x,y){
  if(!A.transform) return {x,y};
  const m=A.transform.match(/rotate\(([\d.-]+),([\d.-]+),([\d.-]+)\)/);
  if(!m) return {x,y};
  const ang=-parseFloat(m[1])*Math.PI/180;
  const cx=parseFloat(m[2]);const cy=parseFloat(m[3]);
  const dx=x-cx;const dy=y-cy;
  return{x:cx+dx*Math.cos(ang)-dy*Math.sin(ang),y:cy+dx*Math.sin(ang)+dy*Math.cos(ang)};
}

/* FIX PRINCIPAL: path hit detection en coordenadas lógicas (÷ scale) */
function pointInPathExact(d,canvasX,canvasY){
  try{
    const sc=scale();
    const path=new Path2D(d);
    /* Guardamos estado, escalamos y comprobamos en coords lógicas */
    ctx.save();
    ctx.scale(sc,sc);
    const inside=ctx.isPointInPath(path,canvasX/sc,canvasY/sc);
    ctx.restore();
    return inside;
  }catch(e){return false;}
}

function pointInPolygon(x,y,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

function isInZone(el,canvasX,canvasY){
  const sc=scale();
  const A=el.a;
  /* Convertimos pixel de canvas a coordenadas lógicas */
  const lx=canvasX/sc;
  const ly=canvasY/sc;
  const p=inverseTransformPoint(A,lx,ly);
  const tx=p.x,ty=p.y;

  if(el.t==='ellipse'){
    const dx=(tx-A.cx)/A.rx,dy=(ty-A.cy)/A.ry;
    return dx*dx+dy*dy<=1;
  }
  if(el.t==='circle'){
    const dx=tx-A.cx,dy=ty-A.cy;
    return dx*dx+dy*dy<=A.r*A.r;
  }
  if(el.t==='rect'){
    return tx>=A.x&&tx<=A.x+A.width&&ty>=A.y&&ty<=A.y+A.height;
  }
  if(el.t==='polygon'){
    return pointInPolygon(tx,ty,A.points.split(' ').map(p=>p.split(',').map(Number)));
  }
  if(el.t==='path'){
    return pointInPathExact(A.d,canvasX,canvasY);
  }
  return false;
}

function hitZone(px,py){
  const d=DRAWINGS[currentIdx];
  for(let i=d.zones.length-1;i>=0;i--){
    if(isInZone(d.zones[i],px,py)) return i;
  }
  return -1;
}

function getPos(e){
  const r=canvas.getBoundingClientRect();
  const src=e.touches?e.touches[0]:e;
  return{x:src.clientX-r.left,y:src.clientY-r.top};
}

function handlePaint(e){
  if(e.cancelable) e.preventDefault();
  const p=getPos(e);
  const zi=hitZone(p.x,p.y);
  if(zi<0) return;
  colors[currentIdx][zi]=isEraser?'white':currentColor;
  redraw();
}

canvas.addEventListener('click',handlePaint);
canvas.addEventListener('touchstart',handlePaint,{passive:false});

/* ===== GALERÍA ===== */
const gallery=document.getElementById('gallery');

function buildMiniSVG(d){
  const ns='http://www.w3.org/2000/svg';
  let s=`<svg viewBox="${d.vb}" xmlns="${ns}" width="50" height="50">`;
  d.zones.forEach(el=>{
    if(el.t==='path'){
      s+=`<path d="${el.a.d}" fill="white" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
      return;
    }
    s+=`<${el.t} fill="white" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
    Object.entries(el.a).forEach(([k,v])=>{s+=` ${k}="${v}"`;});
    s+='/>';
  });
  return s+'</svg>';
}

DRAWINGS.forEach((d,i)=>{
  const thumb=document.createElement('div');
  thumb.className='thumb'+(i===0?' active':'');
  thumb.innerHTML=buildMiniSVG(d);
  thumb.addEventListener('click',()=>{
    document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));
    thumb.classList.add('active');
    currentIdx=i;
    document.getElementById('drawing-label').textContent=d.name;
    redraw();
  });
  gallery.appendChild(thumb);
});

});

document.getElementById('btn-borra').addEventListener('click',()=>{

  const b=document.getElementById('btn-borra');

  b.querySelector('span').textContent=isEraser?'✏️':'🩹';
  if(isEraser) document.querySelectorAll('.cbtn').forEach(x=>x.classList.remove('sel'));
});

document.getElementById('btn-limpia').addEventListener('click',()=>{
  if(!confirm('¿Borrar todos los colores de este dibujo?')) return;
  colors[currentIdx]=DRAWINGS[currentIdx].zones.map(()=>'white');
  redraw();
  toast('Dibujo limpio 🧼');
});

/* ===== GUARDAR ===== */
document.getElementById('btn-guarda').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.download='coloreo-'+Date.now()+'.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
  toast('¡Dibujo guardado! 🎉');
});

/* ===== TOAST ===== */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

/* ===== PWA ===== */
let deferredPrompt=null;
const instalarBtn=document.getElementById('instalar-app');
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;instalarBtn.style.display='block';
});
instalarBtn.addEventListener('click',async()=>{
  if(!deferredPrompt){toast('Abre el menú del navegador y selecciona "Instalar aplicación".');return;}
  deferredPrompt.prompt();
  const resultado=await deferredPrompt.userChoice;
  console.log('Instalación:',resultado.outcome);
  deferredPrompt=null;instalarBtn.style.display='none';
});
window.addEventListener('appinstalled',()=>{
  instalarBtn.style.display='none';deferredPrompt=null;toast('¡Aplicación instalada! 🎉');
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./service-worker.js')
      .then(()=>console.log('SW registrado'))
      .catch(e=>console.error('SW error:',e));
  });
}

window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('drawing-label').textContent=DRAWINGS[0].name;
  resizeCanvas();
});
window.addEventListener('resize',resizeCanvas);
