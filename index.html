<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ficha de Dibujos para Colorear</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
    font-family: Arial, sans-serif;
}

.ficha {
    width: 100%;
    max-width: 1500px;
    margin: auto;
    background: white;
    padding: 10px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
}

.celda {
    position: relative;
    aspect-ratio: 1.25 / 1;
    border: 1px solid #bbb;
    border-radius: 14px;
    background: white;
    overflow: hidden;
}

.numero {
    position: absolute;
    left: 18px;
    top: 12px;
    font-size: 28px;
    font-weight: bold;
    z-index: 10;
}

svg {
    width: 100%;
    height: 100%;
    display: block;
}

.linea {
    fill: white;
    stroke: black;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.linea-fina {
    fill: none;
    stroke: black;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
}

@media print {

    body {
        background: white;
        padding: 0;
    }

    .ficha {
        max-width: none;
        padding: 5mm;
    }

    .celda {
        break-inside: avoid;
    }
}
</style>
</head>
